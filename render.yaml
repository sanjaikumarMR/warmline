
# Render blueprint for Warmline — Free Tier

services:
  - type: web
    name: warmline-web
    runtime: node
    plan: free

    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter @warmline/db generate && pnpm --filter @warmline/db deploy && pnpm --filter @warmline/web build

    startCommand: pnpm --filter @warmline/web start
    healthCheckPath: /login

    envVars:
      - key: NODE_VERSION
        value: "22"

      - key: AI_PROVIDER
        value: aistudio

      - key: AI_MODEL
        value: gemma-4-31b-it

